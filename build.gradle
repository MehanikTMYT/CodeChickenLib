import groovy.json.JsonOutput

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
}

group = 'io.codechicken'
version = mod_version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(java_version as int)
    }
    withSourcesJar()
    withJavadocJar()
}

base {
    archivesName = mod_id
}

neoForge {
    version = neo_version
    
    mods {
        codechickenlib {
            sourceSet sourceSets.main
        }
    }

    accessTransformers {
        publish file("src/main/resources/META-INF/accesstransformer.cfg")
    }

    interfaceInjectionData {
        from file('src/main/resources/META-INF/interfaces.json')
        publish file('src/main/resources/META-INF/interfaces.json')
    }

    runs {
        configureEach {
            sourceSet = sourceSets.main
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file("src/main/generated").absolutePath, '--existing', file("src/main/resources").absolutePath
        }
    }
}

sourceSets.main.resources.srcDirs += "src/main/generated"

// Порт 26.1.2: тесты 1.21.x не переведены (BooleanList и др. старые API) — не компилируем/не гоняем
tasks.named('compileTestJava') { enabled = false }
tasks.named('test') { enabled = false }

processResources {
    def replaceProperties = [
            'file': ['jarVersion': mod_version],
            'mod_id': mod_id,
            'mc_version': minecraft_version,
            'forge_version': neo_version,
            'lang_version': neo_version.split("\\.")[0],
            'minecraft_version_range': minecraft_version_range,
            'neo_version_range': neo_version_range,
            'loader_version_range': loader_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') { expand replaceProperties }
}

repositories {
    mavenLocal()
    maven { url "https://maven.covers1624.net/" }
    maven { url "https://maven.blamejared.com/" }
}

dependencies {
    // Quack dependency
    jarJar(implementation('net.covers1624:Quack')) {
        version {
            strictly '[0.4.10,0.5)'
            prefer '0.4.10.128'
        }
    }
    
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : mod_id,
            'Specification-Vendor'    : 'covers1624',
            'Specification-Version'   : "1",
            'Implementation-Title'    : base.archivesName.get(),
            'Implementation-Vendor'   : 'covers1624',
            'Implementation-Version'  : mod_version,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'mixins.codechickenlib.json'
        ])
    }
    from file("LICENSE")
}

javadoc {
    options.addBooleanOption("Xdoclint:none", true)
}


// port-26.1.2: публикация в mavenLocal (нужна потребителям, напр. BrandonsCore)
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
