modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GNU Lesser General Public License v2.1"
issueTrackerURL="https://github.com/TheCBProject/CodeChickenLib"

[[mixins]]
config="mixins.codechickenlib.json"

[[mods]]
	modId="${mod_id}"
	displayName="CodeChicken Lib"
	version="${file.jarVersion}"

	updateJSONURL="https://version-check.covers1624.net/check/?mod=CodeChickenLib&mc=${mc_version}"
	displayURL="https://www.curseforge.com/minecraft/mc-mods/codechicken-lib-1-8"
	authors="ChickenBones, covers1624"
	description='''
CodeChickenLib is a library of systems to help make various aspects of minecraft modding easier.
It contains libraries for 3D math and transformations, model rendering, packets, config, colours, asm and a few other things..
    '''
[[dependencies.${mod_id}]]
	modId="neoforge"
	type="required"
	versionRange="${neo_version_range}"
	ordering="NONE"
	side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"